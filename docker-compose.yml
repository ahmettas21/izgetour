version: '3.8'

services:
  izgetour:
    build: .
    container_name: izgetour
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
    networks:
      - izgetour-net

networks:
  izgetour-net:
    driver: bridge
