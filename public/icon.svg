<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <rect width="512" height="512" rx="100" fill="#0f172a"/>
  <!-- Compass - outer ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#F5A623" stroke-width="18"/>
  <!-- Compass - inner circle -->
  <circle cx="256" cy="256" r="50" fill="#F5A623"/>
  <!-- Compass needles - N/S -->
  <polygon points="256,86 226,200 256,170 286,200" fill="#ffffff"/>
  <polygon points="256,426 286,312 256,342 226,312" fill="#F5A623"/>
  <!-- Compass needles - E/W -->
  <polygon points="86,256 200,226 170,256 200,286" fill="#F5A623"/>
  <polygon points="426,256 312,286 342,256 312,226" fill="#ffffff"/>
  <!-- Star and Crescent (Turkish) -->
  <g transform="translate(340, 100)">
    <path d="M0 0 A30 30 0 1 1 0 60 A25 25 0 1 0 0 0" fill="#ffffff"/>
    <circle cx="13" cy="30" r="2.5" fill="#ffffff"/>
  </g>
  <!-- "izge" text -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="42" fill="#ffffff" letter-spacing="4">izge</text>
</svg>
