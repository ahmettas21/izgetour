name: CI - Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ─────────────── Lint & Type Check ───────────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm install

      - name: ESLint
        run: npm run lint -- --max-warnings=100 2>&1 || echo "ESLint warnings found (non-blocking)"

      - name: TypeScript Check
        run: npx tsc --noEmit 2>&1 || echo "TypeScript errors found (non-blocking)"

  # ─────────────── Production Build ───────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm install

      - name: Next.js Build
        run: npm run build
        env:
          # Build sırasında env değişkenleri gerekirse buraya eklenir.
          NEXT_PUBLIC_SITE_URL: 'https://izgetour.com'

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 3

  # ─────────────── Docker Build (optional) ───────────────
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    # Sadece main branch'e push'ta çalışsın
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: izgetour:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
